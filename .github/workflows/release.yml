name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Plugin version: ${VERSION}"

      - name: Verify version numbers agree
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          HEADER_VERSION=$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' api-rate-limit-now.php | head -1 | tr -d '[:space:]')
          CONSTANT_VERSION=$(sed -n "s/^define( 'WPTARL_VERSION', '\(.*\)' );[[:space:]]*$/\1/p" api-rate-limit-now.php | head -1 | tr -d '[:space:]')
          README_VERSION=$(sed -n 's/^Stable tag:[[:space:]]*\(.*\)$/\1/p' readme.txt | head -1 | tr -d '[:space:]')

          echo "Git tag ................ ${TAG_VERSION}"
          echo "Plugin header .......... ${HEADER_VERSION}"
          echo "WPTARL_VERSION ......... ${CONSTANT_VERSION}"
          echo "readme.txt stable tag .. ${README_VERSION}"

          VERSION_MISMATCH=0
          for CANDIDATE_VERSION in "${HEADER_VERSION}" "${CONSTANT_VERSION}" "${README_VERSION}"; do
            if [ "${CANDIDATE_VERSION}" != "${TAG_VERSION}" ]; then
              VERSION_MISMATCH=1
            fi
          done

          if [ "${VERSION_MISMATCH}" -ne 0 ]; then
            echo "::error::Version mismatch. The plugin header, WPTARL_VERSION and the readme.txt stable tag must all read ${TAG_VERSION}."
            exit 1
          fi

          echo "All version numbers agree on ${TAG_VERSION}."

      - name: Prepare plugin directory
        run: |
          mkdir -p build
          rsync -av --exclude-from=.distignore ./ build/api-rate-limit-now/

      - name: Build release zips
        # The generic zip is a copy of the versioned one, so both are byte-identical.
        run: |
          cd build
          zip -r api-rate-limit-now-${{ steps.get_version.outputs.version }}.zip api-rate-limit-now/
          cp api-rate-limit-now-${{ steps.get_version.outputs.version }}.zip api-rate-limit-now.zip
          cd ..

      - name: Upload versioned zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-rate-limit-now-${{ steps.get_version.outputs.version }}
          path: build/api-rate-limit-now-${{ steps.get_version.outputs.version }}.zip

      - name: Upload generic zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-rate-limit-now
          path: build/api-rate-limit-now.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/api-rate-limit-now-${{ steps.get_version.outputs.version }}.zip
            build/api-rate-limit-now.zip
          body: |
            **API Rate Limiter v${{ steps.get_version.outputs.version }}**

            Rate-limit WordPress REST API calls by client IP address.

            Download `api-rate-limit-now.zip` and install via WordPress admin (Plugins → Add New → Upload Plugin), or upload to your `wp-content/plugins/` directory.

            Sites running a version with the in-plugin GitHub updater receive this update automatically.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
